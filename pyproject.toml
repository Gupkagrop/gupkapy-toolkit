[project]
name = "pocket-toolkit"
version = "1.0.0"
description = "Высокопроизводительная библиотека структур данных, алгоритмов и утилит на чистом Python 3.12+ (Zero-Dependencies)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Gupkagrop", email = "denislopuhov3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = [
    "data-structures",
    "algorithms",
    "toolkit",
    "zero-dependencies",
    "lru-cache",
    "circuit-breaker",
    "rate-limiter",
    "utilities",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Gupkagrop/gupkagropy"
Repository = "https://github.com/Gupkagrop/gupkagropy.git"
Issues = "https://github.com/Gupkagrop/gupkagropy/issues"
Changelog = "https://github.com/Gupkagrop/gupkagropy/blob/main/ROADMAP.md"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
